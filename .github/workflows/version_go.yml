name: Docker Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v3.*'

jobs:
  build:
    environment: DOCKER_HUB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -v -o build/go-reverseproxy-ssl ./cmd/reverseproxy

      - name: Test
        run: go test -v -race ./...

      - name: Check release for vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
          cd build/package/docker/grpc-server
          go test ./...
          govulncheck ./...
        
      - name: Log into docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: false

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: janmbaco/go-reverseproxy-ssl
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the release image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/package/Dockerfile
          pull: true
          platforms: linux/amd64
          outputs: type=image,name=janmbaco/go-reverseproxy-ssl,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test the runtime image
        env:
          IMAGE: janmbaco/go-reverseproxy-ssl@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$IMAGE" --help
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            test -s /etc/ssl/certs/ca-certificates.crt
            test -s /usr/share/zoneinfo/UTC
            test "$(su-exec reverseproxy id -u)" = 1000
          '

      - name: Check the published runtime packages with Docker Scout
        uses: docker/scout-action@b265cd48f8a1451d2680815b3e8dc4ed65ee16e7 # v1.30.0
        with:
          command: quickview,cves
          image: registry://janmbaco/go-reverseproxy-ssl@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          only-package-types: apk
          only-fixed: true
          exit-code: true
          write-comment: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the verified image
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mapfile -t tags <<< "$TAGS"
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          docker buildx imagetools create "${args[@]}" "janmbaco/go-reverseproxy-ssl@$DIGEST"
