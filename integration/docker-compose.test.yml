services:
  fixture:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        cp /seed/config.json /config/config.json
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' \
          -addext 'subjectAltName=DNS:localhost,DNS:*.localhost' \
          -keyout /certs/localhost-key.pem -out /certs/localhost-cert.pem
        chown -R 1000:1000 /config /certs
    volumes:
      - ./testdata/config-docker.json:/seed/config.json:ro
      - test-config:/config
      - test-certs:/certs
  # Backend test services
  backend-8080:
    image: nginx:alpine
    command: sh -c "echo 'Service on port 8080' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks:
      - test-network

  backend-8081:
    image: nginx:alpine
    command: sh -c "echo 'Service on port 8081' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks:
      - test-network

  backend-8082:
    image: nginx:alpine
    command: sh -c "echo 'Service on port 8082' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks:
      - test-network

  backend-8083:
    image: nginx:alpine
    command: sh -c "echo 'Service on port 8083' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks:
      - test-network

  grpc-backend:
    build:
      context: ../build/package/docker/grpc-server
      dockerfile: Dockerfile
    networks:
      - test-network

  # Reverse proxy
  reverse-proxy:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:8081:8081"
    volumes:
      - test-certs:/app/certs
      - test-config:/app/config
    depends_on:
      fixture:
        condition: service_completed_successfully
      backend-8080:
        condition: service_started
      backend-8081:
        condition: service_started
      backend-8082:
        condition: service_started
      backend-8083:
        condition: service_started
      grpc-backend:
        condition: service_started
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  test-config:
  test-certs:
